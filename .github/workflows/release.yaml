# Workflow for creating GitHub releases when a version tag is pushed
name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract release notes
        id: release_notes
        run: |
          # Extract the section for this version from NEWS.md
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          sed -n "/^# gsDesignNB $VERSION/,/^# gsDesignNB /p" NEWS.md | sed '$d' | tail -n +2 > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release notes for version $VERSION" > release_notes.md
            echo "" >> release_notes.md
            echo "See NEWS.md for details." >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
