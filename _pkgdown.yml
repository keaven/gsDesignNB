url: https://keaven.github.io/gsDesignNB/

template:
  bootstrap: 5
  bslib:
    preset: "bootstrap"
  math-rendering: "mathjax"

reference:
  - title: "Sample size calculation"
    desc: >
      Plan fixed negative binomial designs for recurrent-event outcomes, with
      Wald or score-test sizing.
    contents:
      - sample_size_nbinom
      - print.sample_size_nbinom_result
      - summary.sample_size_nbinom_result
      - print.sample_size_nbinom_summary

  - title: "Simulation"
    desc: >
      Simulate recurrent-event data, seasonal intensity patterns, and NB
      monitoring or SSR scenarios.
    contents:
      - nb_sim
      - nb_sim_seasonal
      - sim_gs_nbinom
      - sim_ssr_nbinom
      - check_gs_bound
      - summarize_gs_sim
      - summarize_ssr_sim

  - title: "Analysis"
    desc: >
      Analyze interim negative binomial data with Wald or score tests and
      estimate information for monitoring or SSR.
    contents:
      - blinded_ssr
      - unblinded_ssr
      - calculate_blinded_info
      - estimate_nb_mom
      - mutze_test
      - print.mutze_test
      - cut_data_by_date
      - cut_completers
      - cut_date_for_completers
      - compute_info_at_time
      - get_analysis_date
      - get_cut_date

  - title: "Group sequential design"
    desc: >
      Extend negative binomial designs to group sequential monitoring via gsDesign boundaries.
    contents:
      - gsNBCalendar
      - toInteger
      - summary.gsNB
      - print.gsNBsummary

  - title: "Multiple imputation"
    desc: >
      Impute missing longitudinal negative binomial counts under MAR,
      reference-based MNAR, and composite ICE strategies.
    contents:
      - impute_nb
      - fit_nb_glmm
      - impute_nb_mar
      - impute_nb_mnar_ref
      - impute_nb_composite

  - title: "Documentation site"
    desc: >
      Preview the pkgdown website locally over HTTP (avoids unstyled `file://` pages).
    contents:
      - preview_pkgdown_site

  - title: "Interactive prototype"
    desc: >
      Launch the optional Shiny explorer for adaptive negative binomial SSR scenarios.
    contents:
      - run_ssr_shiny

  - title: "gsDesign re-exports"
    desc: >
      Spending functions and utilities re-exported from the gsDesign package for convenience.
    contents:
      - gsDesign
      - gsBoundSummary
      - sfBetaDist
      - sfCauchy
      - sfExponential
      - sfExtremeValue
      - sfExtremeValue2
      - sfGapped
      - sfHSD
      - sfLDOF
      - sfLDPocock
      - sfLinear
      - sfLogistic
      - sfNormal
      - sfPoints
      - sfPower
      - sfStep
      - sfTDist
      - sfTrimmed
      - sfTruncated
      - sfXG1
      - sfXG2
      - sfXG3

articles:
  - title: "Design fundamentals"
    contents:
      - sample-size-nbinom
      - non-inferiority-example

  - title: "Simulation and validation"
    contents:
      - simulation-example
      - seasonal-simulation
      - verification-simulation
      - score-vs-wald-simulation
      - score-vs-wald-simulation_v1

  - title: "Group sequential monitoring"
    contents:
      - group-sequential-simulation
      - completers-interim-example

  - title: "Sample size re-estimation"
    contents:
      - ssr-example
      - ssr-simulation-study
      - blinded-info-diagnostics

  - title: "Advanced workflows"
    contents:
      - multiple-imputation-nb
      - ai-skills
      - sample-size-skills-example
